name: hodi_mobile
description: HODI Portal mobile app for property management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.1.0

  # Networking
  dio: ^5.9.1

  # Storage
  flutter_secure_storage: ^10.0.0

  # Biometric Authentication
  local_auth: ^2.3.0

  # UI
  google_fonts: ^8.0.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8

  # File handling
  open_filex: ^4.7.0
  path_provider: ^2.1.5

  # Forms
  reactive_forms: ^18.2.2

  # Formatting
  intl: ^0.20.2

  # Camera & OCR
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.14.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # WebView
  webview_flutter: ^4.13.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.5.4
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  riverpod_lint: ^3.1.3
  mockito: ^5.4.6
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#667EEA"
  adaptive_icon_foreground: "assets/images/app-icon.png"

flutter_native_splash:
  color: "#667EEA"
  image: "assets/images/splash-logo.png"
  android_12:
    color: "#667EEA"
    image: "assets/images/splash-logo.png"
    icon_background_color: "#667EEA"
